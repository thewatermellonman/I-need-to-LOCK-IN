<html lang="en">
<header>

<body>

        <label for="activity1">Fist Activity (time is in minutes)</label>
        <input type="text" id="activity1" placeholder="e.g., code, clean, homework">
        <input type="numbers" id="activity1time" placeholder="30">

        <label for="activity2">Fist Activity (time is in minutes)</label>

    <div class="timer">
        <h3>Are you ready?</h3>
